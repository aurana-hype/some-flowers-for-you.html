<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Enchanted Bouquet</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010101;
}

body{
    background:
        radial-gradient(
            ellipse at 50% 40%,
            rgba(95,45,25,.18),

        ),

}

canvas{
    position:fixed;
    inset:0;

}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H,DPR;

function resize(){

    DPR=Math.min(
        window.devicePixelRatio||1,
        2
    );

    W=innerWidth;
    H=innerHeight;

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

addEventListener("resize",resize);
resize();


/* =========================================================
   RANDOM
========================================================= */

let seed=81273921;

function random(){

    seed=
        (seed*1664525+1013904223)
        >>>0;

    return seed/4294967296;
}

function rnd(a,b){
    return a+random()*(b-a);
}

function S(){
    return Math.min(
        W/760,
        H/930
    );
}


/* =========================================================
   COLORS
========================================================= */

const C={

rosePink:{
    a:"#fffdfd",
    b:"#ffdce5",
    c:"#ed91a8",
    d:"#b94e6c",
    e:"#632d43",
    center:"#e0a343"
},

roseRed:{
    a:"#fff5f3",
    b:"#f8b9bd",
    c:"#dc6872",
    d:"#a33c51",
    e:"#54273b",
    center:"#d99b3e"
},

coral:{
    a:"#fffaf5",
    b:"#ffd1c1",
    c:"#ef967d",
    d:"#c45a5c",
    e:"#71323c",
    center:"#dca042"
},

lilyWhite:{
    a:"#ffffff",
    b:"#fffdec",
    c:"#e8e2cd",
    d:"#beb49a",
    e:"#6d6559",
    center:"#e5a73c"
},

lilyPink:{
    a:"#fffafa",
    b:"#ffdce9",
    c:"#e9a0b8",
    d:"#bc607e",
    e:"#6b354c",
    center:"#dba141"
},

lavender:{
    a:"#fffaff",
    b:"#e9d9ff",
    c:"#b594df",
    d:"#7653a9",
    e:"#432f67",
    center:"#dfad54"
},

purple:{
    a:"#fffaff",
    b:"#ddcaf7",
    c:"#a07acb",
    d:"#674796",
    e:"#3b295d",
    center:"#dfad50"
},

tulipPink:{
    a:"#fffafd",
    b:"#ffc9d9",
    c:"#ee789a",
    d:"#b94068",
    e:"#632b45",
    center:"#d79f40"
},

tulipOrange:{
    a:"#fffaf1",
    b:"#ffd29c",
    c:"#ef8d51",
    d:"#c4513d",
    e:"#71313a",
    center:"#dda246"
},

peach:{
    a:"#fffaf5",
    b:"#ffddc6",
    c:"#f1a681",
    d:"#d16d62",
    e:"#753944",
    center:"#dda141"
}
};


/* =========================================================
   BOUQUET
========================================================= */

function center(){

    return {
        x:W/2,
        y:H*.405
    };
}

function base(){

    const c=center();

    return {
        x:c.x,
        y:c.y+215*S()
    };
}


/* =========================================================
   FLOWERS
========================================================= */

const flowers=[];

const types=[

["rose","rosePink"],
["rose","rosePink"],
["rose","roseRed"],
["rose","coral"],

["lily","lilyWhite"],
["lily","lilyWhite"],
["lily","lilyPink"],

["tulip","tulipPink"],
["tulip","tulipOrange"],

["cosmos","purple"],
["cosmos","lavender"],
["cosmos","lavender"]

];


/*
   MUCH DENSER MAIN BOUQUET
*/

for(let i=0;i<135;i++){

    const a=
        random()*Math.PI*2;

    const radiusX=
        rnd(25,220);

    const radiusY=
        rnd(30,190);

    const x=
        Math.cos(a)*radiusX;

    const y=
        Math.sin(a)*radiusY-90;

    const t=
        types[
            Math.floor(
                random()*types.length
            )
        ];

    flowers.push({

        x,
        y,

        size:rnd(14,30),

        type:t[0],
        color:t[1],

        angle:rnd(-1.2,1.2),

        view:rnd(.45,1),

        depth:rnd(0,1),

        phase:random()*Math.PI*2,

        sway:rnd(.25,1.3),

        delay:rnd(0,1.2)
    });
}


/*
   EXTRA OUTER RANDOM FLOWERS
*/

for(let i=0;i<42;i++){

    const side=
        random()<.5?-1:1;

    flowers.push({

        x:side*rnd(150,240),

        y:rnd(-140,70),

        size:rnd(13,26),

        type:types[
            Math.floor(
                random()*types.length
            )
        ][0],

        color:types[
            Math.floor(
                random()*types.length
            )
        ][1],

        angle:side*rnd(.15,1.15),

        view:rnd(.45,1),

        depth:rnd(0,1),

        phase:random()*Math.PI*2,

        sway:rnd(.3,1.4),

        delay:rnd(.1,1.4)
    });
}


/* =========================================================
   LONG DANGLING LAVENDER
========================================================= */

const hangingLavender=[];


/*
   Banyak lavender yang muncul dari
   bagian atas dan samping buket,
   kemudian menjuntai jauh ke bawah.
*/

for(let i=0;i<48;i++){

    const side=
        random()<.5?-1:1;

    hangingLavender.push({

        side,

        x:side*rnd(80,205),

        startY:rnd(-100,45),

        length:rnd(130,330),

        curve:rnd(-85,85),

        size:rnd(5.5,9),

        angle:rnd(-.45,.45),

        phase:random()*Math.PI*2,

        speed:rnd(.0005,.0011),

        delay:rnd(.2,1.2)
    });
}


/* =========================================================
   NORMAL LAVENDER FILLERS
========================================================= */

const lavender=[];

for(let i=0;i<145;i++){

    lavender.push({

        x:rnd(-225,225),

        y:rnd(-145,90),

        size:rnd(5,10),

        angle:rnd(-1,1),

        phase:random()*Math.PI*2,

        delay:rnd(.1,1)
    });
}


/* =========================================================
   PARTICLES
========================================================= */

const particles=[];

for(let i=0;i<210;i++){

    particles.push({

        x:random(),

        y:random(),

        size:rnd(.4,1.7),

        alpha:rnd(.04,.35),

        phase:random()*Math.PI*2,

        speed:rnd(.3,1.3)
    });
}


/* =========================================================
   BACKGROUND
========================================================= */

function background(time){

    ctx.fillStyle="#010101";

    ctx.fillRect(
        0,0,W,H
    );


    /*
       soft warm atmosphere
    */

    const g=
        ctx.createRadialGradient(
            W*.48,
            H*.40,
            0,
            W*.48,
            H*.40,
            H*.62
        );

    g.addColorStop(
        0,
        "rgba(92,42,23,.16)"
    );

    g.addColorStop(
        .35,
        "rgba(40,18,12,.08)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,0,W,H
    );


    for(const p of particles){

        const pulse=
            .5+
            .5*Math.sin(
                time*p.speed+
                p.phase
            );

        ctx.globalAlpha=
            p.alpha*pulse;

        ctx.fillStyle="#ffe5af";

        ctx.shadowColor=
            "#ffd48a";

        ctx.shadowBlur=8;

        ctx.beginPath();

        ctx.arc(
            p.x*W,
            p.y*H,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
}


/* =========================================================
   DRAMATIC GOLDEN LIGHT
========================================================= */

function dramaticLight(time){

    const c=center();

    /*
       Cahaya utama datang dari kiri atas.
    */

    const lx=
        c.x-
        190*S();

    const ly=
        c.y-
        260*S();


    /*
       Large golden aura
    */

    const glow=
        ctx.createRadialGradient(
            lx,
            ly,
            0,
            lx,
            ly,
            390*S()
        );

    glow.addColorStop(
        0,
        "rgba(255,215,145,.18)"
    );

    glow.addColorStop(
        .18,
        "rgba(255,192,105,.095)"
    );

    glow.addColorStop(
        .5,
        "rgba(255,154,80,.025)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
        0,0,W,H
    );


    /*
       Diagonal soft beam
    */

    ctx.save();

    ctx.globalCompositeOperation=
        "screen";

    ctx.globalAlpha=.055;


    const beam=
        ctx.createLinearGradient(
            lx,
            ly,
            c.x+170*S(),
            c.y+230*S()
        );

    beam.addColorStop(
        0,
        "#ffd98d"
    );

    beam.addColorStop(
        .45,
        "#d99b55"
    );

    beam.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=beam;

    ctx.beginPath();

    ctx.moveTo(
        lx-80*S(),
        ly-60*S()
    );

    ctx.lineTo(
        lx+20*S(),
        ly-40*S()
    );

    ctx.lineTo(
        c.x+210*S(),
        c.y+260*S()
    );

    ctx.lineTo(
        c.x+100*S(),
        c.y+270*S()
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();


    /*
       Tiny moving dust illuminated by light
    */

    const pulse=
        .7+
        .3*Math.sin(time*.0017);

    ctx.save();

    ctx.globalCompositeOperation=
        "screen";

    for(let i=0;i<35;i++){

        const a=
            i*2.399+
            time*.00015;

        const r=
            (80+
            (i*37)%260)*S();

        const x=
            lx+
            Math.cos(a)*r;

        const y=
            ly+
            Math.sin(a)*r*.75;

        ctx.globalAlpha=
            .035*pulse;

        ctx.fillStyle="#ffd990";

        ctx.shadowColor="#ffc66c";

        ctx.shadowBlur=10;

        ctx.beginPath();

        ctx.arc(
            x,y,
            rnd(.5,1.4),
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   STEM
========================================================= */

function stem(
    f,
    progress,
    time
){

    if(progress<=0)return;

    const s=S();

    const c=center();
    const b=base();

    const sway=
        Math.sin(
            time*.001+
            f.phase
        )*
        f.sway*s;

    const ex=
        c.x+
        f.x*s+
        sway;

    const ey=
        c.y+
        f.y*s;

    const sx=b.x;
    const sy=b.y+100*s;

    const dx=ex-sx;
    const dy=ey-sy;

    const cx=
        sx+
        dx*.5+
        f.angle*70*s;

    const cy=
        sy+
        dy*.5;


    const px=
        sx+
        (ex-sx)*progress;

    const py=
        sy+
        (ey-sy)*progress;


    ctx.save();


    /*
       deep stem shadow
    */

    ctx.strokeStyle=
        "rgba(0,0,0,.8)";

    ctx.lineWidth=
        4*s;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(sx,sy);

    ctx.quadraticCurveTo(
        cx+3*s,
        cy+3*s,
        px+2*s,
        py+2*s
    );

    ctx.stroke();


    /*
       realistic green gradient
    */

    const g=
        ctx.createLinearGradient(
            sx,
            sy,
            sx+8*s,
            sy
        );

    g.addColorStop(
        0,
        "#091009"
    );

    g.addColorStop(
        .22,
        "#304c2e"
    );

    g.addColorStop(
        .48,
        "#78915c"
    );

    g.addColorStop(
        .72,
        "#3e5c36"
    );

    g.addColorStop(
        1,
        "#0e180e"
    );

    ctx.strokeStyle=g;

    ctx.lineWidth=
        2*s;

    ctx.beginPath();

    ctx.moveTo(sx,sy);

    ctx.quadraticCurveTo(
        cx,
        cy,
        px,
        py
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   LEAF
========================================================= */

function leaf(
    x,
    y,
    size,
    rotation,
    side=1
){

    const s=S();

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);
    ctx.scale(side,1);


    const g=
        ctx.createLinearGradient(
            0,0,
            size,0
        );

    g.addColorStop(
        0,
        "#0a110a"
    );

    g.addColorStop(
        .28,
        "#3c5c34"
    );

    g.addColorStop(
        .53,
        "#78915e"
    );

    g.addColorStop(
        .78,
        "#3b5833"
    );

    g.addColorStop(
        1,
        "#0d160d"
    );

    ctx.fillStyle=g;

    ctx.shadowColor=
        "rgba(0,0,0,.72)";

    ctx.shadowBlur=
        8*s;


    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.bezierCurveTo(
        size*.18,
        -size*.58,
        size*.72,
        -size*.76,
        size,
        0
    );

    ctx.bezierCurveTo(
        size*.68,
        size*.45,
        size*.23,
        size*.35,
        0,
        0
    );

    ctx.fill();


    ctx.shadowBlur=0;

    ctx.strokeStyle=
        "rgba(235,245,198,.34)";

    ctx.lineWidth=
        Math.max(
            .5,
            size*.02
        );

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.quadraticCurveTo(
        size*.5,
        0,
        size*.92,
        0
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   PETAL
========================================================= */

function petal(
    x,y,w,h,rotation,view,c
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);

    ctx.scale(
        1,
        .28+.72*view
    );


    const g=
        ctx.createLinearGradient(
            0,-h,
            0,h
        );

    g.addColorStop(0,c.a);
    g.addColorStop(.18,c.b);
    g.addColorStop(.54,c.c);
    g.addColorStop(.82,c.d);
    g.addColorStop(1,c.e);

    ctx.fillStyle=g;

    ctx.shadowColor=
        "rgba(0,0,0,.43)";

    ctx.shadowBlur=
        w*.12;


    ctx.beginPath();

    ctx.moveTo(
        -w*.45,
        h*.25
    );

    ctx.bezierCurveTo(
        -w*.72,
        -h*.08,
        -w*.43,
        -h*.83,
        0,
        -h
    );

    ctx.bezierCurveTo(
        w*.43,
        -h*.83,
        w*.72,
        -h*.08,
        w*.45,
        h*.25
    );

    ctx.bezierCurveTo(
        w*.23,
        h*.58,
        -w*.23,
        h*.58,
        -w*.45,
        h*.25
    );

    ctx.fill();


    /*
       Stronger warm highlight
    */

    const hi=
        ctx.createRadialGradient(
            -w*.20,
            -h*.42,
            0,
            0,
            -h*.15,
            w*.55
        );

    hi.addColorStop(
        0,
        "rgba(255,250,210,.48)"
    );

    hi.addColorStop(
        .35,
        "rgba(255,255,255,.14)"
    );

    hi.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle=hi;

    ctx.beginPath();

    ctx.ellipse(
        -w*.13,
        -h*.3,
        w*.18,
        h*.42,
        -.4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   ROSE
========================================================= */

function rose(
    x,y,size,c,rotation,view
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);


    for(let i=0;i<18;i++){

        const a=
            i/18*Math.PI*2;

        const r=size*.28;

        petal(
            Math.cos(a)*r,
            Math.sin(a)*r,
            size*.43,
            size*.56,
            a+Math.PI/2,
            view,
            c
        );
    }


    for(let i=0;i<14;i++){

        const a=
            i/14*Math.PI*2+.2;

        const r=size*.17;

        petal(
            Math.cos(a)*r,
            Math.sin(a)*r,
            size*.34,
            size*.43,
            a+Math.PI/2,
            view,
            c
        );
    }


    for(let i=0;i<9;i++){

        const a=
            i/9*Math.PI*2;

        const r=size*.07;

        petal(
            Math.cos(a)*r,
            Math.sin(a)*r,
            size*.23,
            size*.31,
            a+Math.PI/2,
            view,
            c
        );
    }


    const g=
        ctx.createRadialGradient(
            -size*.05,
            -size*.06,
            0,
            0,0,
            size*.17
        );

    g.addColorStop(0,c.a);
    g.addColorStop(.45,c.c);
    g.addColorStop(1,c.e);

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        0,0,
        size*.13,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   LILY
========================================================= */

function lily(
    x,y,size,c,rotation,view
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);


    for(let i=0;i<6;i++){

        const a=
            i/6*Math.PI*2;

        petal(
            Math.cos(a)*size*.13,
            Math.sin(a)*size*.13,
            size*.48,
            size*.78,
            a+Math.PI/2,
            view,
            c
        );
    }


    for(let i=0;i<6;i++){

        const a=
            i/6*Math.PI*2+.16;

        petal(
            Math.cos(a)*size*.07,
            Math.sin(a)*size*.07,
            size*.3,
            size*.56,
            a+Math.PI/2,
            view,
            c
        );
    }


    for(let i=0;i<6;i++){

        const a=
            i/6*Math.PI*2;

        const xx=
            Math.cos(a)*size*.38;

        const yy=
            Math.sin(a)*size*.38;

        ctx.strokeStyle="#9d713c";

        ctx.lineWidth=
            Math.max(
                .7,
                size*.025
            );

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.lineTo(xx,yy);

        ctx.stroke();


        ctx.fillStyle="#e3ae4c";

        ctx.beginPath();

        ctx.arc(
            xx,
            yy,
            size*.045,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   TULIP
========================================================= */

function tulip(
    x,y,size,c,rotation,view
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);


    const g=
        ctx.createLinearGradient(
            -size*.45,
            -size*.7,
            size*.45,
            size*.7
        );

    g.addColorStop(0,c.a);
    g.addColorStop(.25,c.b);
    g.addColorStop(.55,c.c);
    g.addColorStop(.82,c.d);
    g.addColorStop(1,c.e);

    ctx.fillStyle=g;

    ctx.shadowColor=
        "rgba(0,0,0,.5)";

    ctx.shadowBlur=
        size*.15;


    ctx.beginPath();

    ctx.moveTo(
        -size*.48,
        size*.22
    );

    ctx.bezierCurveTo(
        -size*.57,
        -size*.15,
        -size*.43,
        -size*.58,
        -size*.22,
        -size*.75
    );

    ctx.bezierCurveTo(
        -size*.16,
        -size*.35,
        -size*.04,
        -size*.15,
        0,
        -size*.55
    );

    ctx.bezierCurveTo(
        size*.08,
        -size*.17,
        size*.22,
        -size*.38,
        size*.38,
        -size*.68
    );

    ctx.bezierCurveTo(
        size*.56,
        -.35*size,
        size*.57,
        .02*size,
        size*.48,
        .22*size
    );

    ctx.bezierCurveTo(
        size*.26,
        size*.60,
        -size*.26,
        size*.60,
        -size*.48,
        size*.22
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle=
        "rgba(255,255,255,.25)";

    ctx.lineWidth=
        size*.035;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size*.48
    );

    ctx.quadraticCurveTo(
        -size*.04,
        0,
        0,
        size*.42
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   COSMOS
========================================================= */

function cosmos(
    x,y,size,c,rotation,view
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);


    for(let i=0;i<9;i++){

        const a=
            i/9*Math.PI*2;

        petal(
            Math.cos(a)*size*.17,
            Math.sin(a)*size*.17,
            size*.32,
            size*.60,
            a+Math.PI/2,
            view,
            c
        );
    }


    const g=
        ctx.createRadialGradient(
            -size*.05,
            -size*.05,
            0,
            0,0,
            size*.18
        );

    g.addColorStop(
        0,
        "#fff3ae"
    );

    g.addColorStop(
        .5,
        c.center
    );

    g.addColorStop(
        1,
        "#74471f"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        0,0,
        size*.17,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   FLOWER
========================================================= */

function drawFlower(
    f,
    progress,
    time
){

    if(progress<=0)return;

    const s=S();

    const c=center();

    const sway=
        Math.sin(
            time*.001+
            f.phase
        )*
        f.sway*s;

    const x=
        c.x+
        f.x*s+
        sway;

    const y=
        c.y+
        f.y*s;

    const size=
        f.size*s*progress;


    /*
       leaves tucked into flower mass
    */

    if(size>9){

        leaf(
            x-size*.45,
            y+size*.36,
            size*.85,
            f.angle-1.4,
            -1
        );

        if(f.depth>.3){

            leaf(
                x+size*.30,
                y+size*.4,
                size*.68,
                f.angle+1.35,
                1
            );
        }
    }


    ctx.save();

    ctx.shadowColor=
        "rgba(0,0,0,.78)";

    ctx.shadowBlur=
        size*.32;

    ctx.shadowOffsetY=
        size*.11;


    if(f.type==="rose"){

        rose(
            x,y,
            size,
            C[f.color],
            f.angle,
            f.view
        );

    }else if(f.type==="lily"){

        lily(
            x,y,
            size,
            C[f.color],
            f.angle,
            f.view
        );

    }else if(f.type==="tulip"){

        tulip(
            x,y,
            size,
            C[f.color],
            f.angle,
            f.view
        );

    }else{

        cosmos(
            x,y,
            size,
            C[f.color],
            f.angle,
            f.view
        );
    }

    ctx.restore();
}


/* =========================================================
   SMALL LAVENDER
========================================================= */

function tinyLavender(
    x,y,size,rotation
){

    const c=C.lavender;

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);


    const g=
        ctx.createLinearGradient(
            0,-size,
            0,size
        );

    g.addColorStop(0,c.a);
    g.addColorStop(.25,c.b);
    g.addColorStop(.6,c.c);
    g.addColorStop(1,c.d);

    ctx.fillStyle=g;

    ctx.shadowColor=
        "rgba(0,0,0,.4)";

    ctx.shadowBlur=
        size*.35;


    ctx.beginPath();

    ctx.ellipse(
        0,
        -size*.15,
        size*.32,
        size*.52,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   NORMAL LAVENDER
========================================================= */

function drawLavender(
    l,
    progress,
    time
){

    if(progress<=0)return;

    const s=S();

    const c=center();
    const b=base();

    const sway=
        Math.sin(
            time*.001+
            l.phase
        )*
        1.3*s;

    const x=
        c.x+
        l.x*s+
        sway;

    const y=
        c.y+
        l.y*s;

    const sx=
        b.x+
        l.x*.1*s;

    const sy=
        b.y+80*s;


    ctx.save();

    ctx.strokeStyle="#536d43";

    ctx.lineWidth=
        1.15*s;

    ctx.beginPath();

    ctx.moveTo(sx,sy);

    ctx.quadraticCurveTo(
        x,
        (sy+y)/2,
        x,
        y
    );

    ctx.stroke();


    for(let row=0;row<5;row++){

        for(let i=0;i<4;i++){

            const xx=
                x+
                (i-1.5)*
                l.size*s*.24;

            const yy=
                y+
                row*
                l.size*s*.19;

            tinyLavender(
                xx,
                yy,
                l.size*s*.5,
                l.angle
            );
        }
    }

    ctx.restore();
}


/* =========================================================
   HANGING LAVENDER
========================================================= */

function drawHangingLavender(
    l,
    progress,
    time
){

    if(progress<=0)return;

    const s=S();

    const c=center();

    const startX=
        c.x+
        l.x*s;

    const startY=
        c.y+
        l.startY*s;

    const endX=
        startX+
        l.curve*s;

    const endY=
        startY+
        l.length*s;

    const sway=
        Math.sin(
            time*l.speed+
            l.phase
        )*
        10*s;


    ctx.save();

    /*
       long graceful stem
    */

    const grad=
        ctx.createLinearGradient(
            startX,
            startY,
            endX,
            endY
        );

    grad.addColorStop(
        0,
        "#233b27"
    );

    grad.addColorStop(
        .45,
        "#5b7547"
    );

    grad.addColorStop(
        1,
        "#1d321f"
    );

    ctx.strokeStyle=grad;

    ctx.lineWidth=
        1.35*s;

    ctx.beginPath();

    ctx.moveTo(
        startX,
        startY
    );

    ctx.bezierCurveTo(
        startX+l.curve*.3*s,
        startY+l.length*.25*s,
        endX-l.curve*.25*s+sway,
        startY+l.length*.7*s,
        endX+sway,
        endY
    );

    ctx.stroke();


    /*
       tiny leaves along the hanging stem
    */

    for(let i=0;i<6;i++){

        const t=
            .15+i*.13;

        const lx=
            startX+
            (endX-startX)*t+
            sway*Math.sin(t*Math.PI);

        const ly=
            startY+
            (endY-startY)*t;

        leaf(
            lx,
            ly,
            13*s,
            l.side>0
                ? -1.05
                : -2.1,
            l.side
        );
    }


    /*
       lavender head at lower part
    */

    const headT=.76;

    const hx=
        startX+
        (endX-startX)*headT+
        sway;

    const hy=
        startY+
        (endY-startY)*headT;


    for(let row=0;row<8;row++){

        const spread=
            (row%2)*2-1;

        for(let j=0;j<3;j++){

            const xx=
                hx+
                (j-1)*
                l.size*s*.38+
                spread*l.size*s*.15;

            const yy=
                hy+
                row*
                l.size*s*.28;

            tinyLavender(
                xx,
                yy,
                l.size*s*.72,
                l.angle
            );
        }
    }

    ctx.restore();
}


/* =========================================================
   WRAPPING
========================================================= */

function wrapping(progress){

    if(progress<.45)return;

    const s=S();

    const b=base();

    const p=
        Math.min(
            1,
            (progress-.45)/.55
        );

    const x=b.x;

    const topY=b.y-125*s;
    const waistY=b.y+55*s;
    const bottomY=b.y+285*s;

    const topW=205*s;
    const waistW=48*s;
    const bottomW=105*s;


    ctx.save();

    ctx.globalAlpha=.96*p;


    /*
       rear sheet
    */

    const rear=
        ctx.createLinearGradient(
            x-topW,
            topY,
            x+topW,
            bottomY
        );

    rear.addColorStop(
        0,
        "rgba(255,220,210,.22)"
    );

    rear.addColorStop(
        .35,
        "rgba(255,185,180,.35)"
    );

    rear.addColorStop(
        .65,
        "rgba(255,231,222,.18)"
    );

    rear.addColorStop(
        1,
        "rgba(176,100,105,.15)"
    );

    ctx.fillStyle=rear;


    ctx.beginPath();

    ctx.moveTo(
        x-topW,
        topY
    );

    ctx.bezierCurveTo(
        x-topW*.95,
        b.y-35*s,
        x-130*s,
        b.y+15*s,
        x-waistW,
        waistY
    );

    ctx.lineTo(
        x-bottomW,
        bottomY
    );

    ctx.lineTo(
        x,
        bottomY
    );

    ctx.lineTo(
        x,
        topY
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        x+topW,
        topY
    );

    ctx.bezierCurveTo(
        x+topW*.95,
        b.y-35*s,
        x+130*s,
        b.y+15*s,
        x+waistW,
        waistY
    );

    ctx.lineTo(
        x+bottomW,
        bottomY
    );

    ctx.lineTo(
        x,
        bottomY
    );

    ctx.lineTo(
        x,
        topY
    );

    ctx.closePath();

    ctx.fill();


    /*
       LEFT CROSS
    */

    ctx.fillStyle=
        "rgba(255,242,235,.28)";

    ctx.beginPath();

    ctx.moveTo(
        x-topW,
        topY
    );

    ctx.lineTo(
        x+8*s,
        waistY
    );

    ctx.lineTo(
        x-bottomW*.72,
        bottomY
    );

    ctx.lineTo(
        x-bottomW*.05,
        bottomY
    );

    ctx.lineTo(
        x-waistW,
        waistY
    );

    ctx.closePath();

    ctx.fill();


    /*
       RIGHT CROSS
    */

    ctx.fillStyle=
        "rgba(255,236,230,.25)";

    ctx.beginPath();

    ctx.moveTo(
        x+topW,
        topY
    );

    ctx.lineTo(
        x-8*s,
        waistY
    );

    ctx.lineTo(
        x+bottomW*.72,
        bottomY
    );

    ctx.lineTo(
        x+bottomW*.05,
        bottomY
    );

    ctx.lineTo(
        x+waistW,
        waistY
    );

    ctx.closePath();

    ctx.fill();


    /*
       CENTRAL V
    */

    const middle=
        ctx.createLinearGradient(
            x,
            topY,
            x,
            waistY
        );

    middle.addColorStop(
        0,
        "rgba(255,255,255,.11)"
    );

    middle.addColorStop(
        .55,
        "rgba(255,229,220,.30)"
    );

    middle.addColorStop(
        1,
        "rgba(192,107,119,.15)"
    );

    ctx.fillStyle=middle;

    ctx.beginPath();

    ctx.moveTo(
        x-topW*.53,
        topY+5*s
    );

    ctx.lineTo(
        x,
        waistY+4*s
    );

    ctx.lineTo(
        x+topW*.53,
        topY+5*s
    );

    ctx.closePath();

    ctx.fill();


    /*
       thick folded borders
    */

    ctx.strokeStyle=
        "rgba(255,244,235,.48)";

    ctx.lineWidth=
        2.3*s;

    ctx.lineJoin="round";

    ctx.lineCap="round";


    ctx.beginPath();

    ctx.moveTo(
        x-topW,
        topY
    );

    ctx.lineTo(
        x-waistW,
        waistY
    );

    ctx.lineTo(
        x-bottomW*.72,
        bottomY
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        x+topW,
        topY
    );

    ctx.lineTo(
        x+waistW,
        waistY
    );

    ctx.lineTo(
        x+bottomW*.72,
        bottomY
    );

    ctx.stroke();


    /*
       folds
    */

    ctx.strokeStyle=
        "rgba(255,240,232,.18)";

    ctx.lineWidth=
        1*s;


    for(let i=-5;i<=5;i++){

        const off=
            i*17*s;

        ctx.beginPath();

        ctx.moveTo(
            x+off,
            waistY
        );

        ctx.quadraticCurveTo(
            x+off*1.3,
            b.y+165*s,
            x+off*.7,
            bottomY
        );

        ctx.stroke();
    }


    /*
       top lip
    */

    ctx.strokeStyle=
        "rgba(255,244,235,.55)";

    ctx.lineWidth=
        3*s;

    ctx.beginPath();

    ctx.moveTo(
        x-topW,
        topY
    );

    for(let i=0;i<=16;i++){

        const t=i/16;

        const xx=
            x-topW+
            topW*2*t;

        const yy=
            topY+
            Math.sin(
                t*Math.PI*8
            )*4*s;

        ctx.lineTo(
            xx,
            yy
        );
    }

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   ANIMATED RIBBON
========================================================= */

function ribbon(
    progress,
    time
){

    if(progress<.68)return;

    const s=S();
    const b=base();

    const p=
        Math.min(
            1,
            (progress-.68)/.32
        );

    const x=b.x;
    const y=b.y+55*s;


    /*
       wind movement
    */

    const wind=
        Math.sin(time*.0024)*9*s;

    const wind2=
        Math.sin(time*.0031+1.7)*7*s;


    ctx.save();

    ctx.globalAlpha=p;


    const rg=
        ctx.createLinearGradient(
            x-150*s,
            y,
            x+150*s,
            y+50*s
        );

    rg.addColorStop(
        0,
        "#593040"
    );

    rg.addColorStop(
        .18,
        "#b86d7d"
    );

    rg.addColorStop(
        .36,
        "#efb8b8"
    );

    rg.addColorStop(
        .5,
        "#fff0e5"
    );

    rg.addColorStop(
        .67,
        "#d98d98"
    );

    rg.addColorStop(
        .85,
        "#965365"
    );

    rg.addColorStop(
        1,
        "#4a2938"
    );


    ctx.strokeStyle=rg;

    ctx.lineWidth=
        21*s;

    ctx.lineCap="round";

    ctx.shadowColor=
        "rgba(0,0,0,.8)";

    ctx.shadowBlur=
        16*s;


    /*
       LEFT LOOP
    */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.bezierCurveTo(
        x-48*s,
        y-75*s+wind,
        x-145*s,
        y-75*s+wind2,
        x-158*s,
        y-8*s+wind
    );

    ctx.bezierCurveTo(
        x-170*s,
        y+62*s+wind2,
        x-72*s,
        y+78*s+wind,
        x-8*s,
        y+4*s
    );

    ctx.stroke();


    /*
       RIGHT LOOP
    */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.bezierCurveTo(
        x+48*s,
        y-75*s-wind,
        x+145*s,
        y-75*s-wind2,
        x+158*s,
        y-8*s-wind
    );

    ctx.bezierCurveTo(
        x+170*s,
        y+62*s-wind2,
        x+72*s,
        y+78*s-wind,
        x+8*s,
        y+4*s
    );

    ctx.stroke();


    /*
       LONG WAVING LEFT TAIL
    */

    ctx.lineWidth=
        17*s;

    ctx.beginPath();

    ctx.moveTo(
        x-7*s,
        y+4*s
    );

    ctx.bezierCurveTo(
        x-55*s,
        y+80*s+wind,
        x-125*s,
        y+145*s+wind2,
        x-75*s,
        y+285*s+wind
    );

    ctx.stroke();


    /*
       LONG WAVING RIGHT TAIL
    */

    ctx.beginPath();

    ctx.moveTo(
        x+7*s,
        y+4*s
    );

    ctx.bezierCurveTo(
        x+55*s,
        y+82*s-wind,
        x+125*s,
        y+145*s-wind2,
        x+70*s,
        y+275*s-wind
    );

    ctx.stroke();


    ctx.shadowBlur=0;


    /*
       ribbon highlights
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.42)";

    ctx.lineWidth=
        3*s;


    ctx.beginPath();

    ctx.moveTo(
        x-2*s,
        y-1*s
    );

    ctx.bezierCurveTo(
        x-48*s,
        y-55*s+wind,
        x-116*s,
        y-53*s+wind2,
        x-140*s,
        y-13*s
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        x+2*s,
        y-1*s
    );

    ctx.bezierCurveTo(
        x+48*s,
        y-55*s-wind,
        x+116*s,
        y-53*s-wind2,
        x+140*s,
        y-13*s
    );

    ctx.stroke();


    /*
       KNOT
    */

    const knot=
        ctx.createRadialGradient(
            x-9*s,
            y-10*s,
            0,
            x,
            y,
            35*s
        );

    knot.addColorStop(
        0,
        "#fff4e9"
    );

    knot.addColorStop(
        .27,
        "#e8a5a7"
    );

    knot.addColorStop(
        .65,
        "#a45d70"
    );

    knot.addColorStop(
        1,
        "#4b2c3b"
    );

    ctx.fillStyle=knot;

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        32*s,
        24*s,
        -.1,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle=
        "rgba(255,255,255,.52)";

    ctx.beginPath();

    ctx.ellipse(
        x-8*s,
        y-8*s,
        9*s,
        5*s,
        -.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   BUTTERFLIES
========================================================= */

const butterflies=[];

for(let i=0;i<9;i++){

    butterflies.push({

        angle:random()*Math.PI*2,

        radius:rnd(195,290),

        speed:rnd(.0003,.0007),

        phase:random()*Math.PI*2,

        size:rnd(7,13)
    });
}


function butterfly(
    x,y,size,rotation,flap
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);

    ctx.globalCompositeOperation=
        "screen";

    ctx.shadowColor=
        "rgba(255,255,255,.95)";

    ctx.shadowBlur=
        size*2.5;

    ctx.globalAlpha=
        .62+
        .25*Math.sin(flap);


    ctx.fillStyle=
        "rgba(255,255,255,.85)";


    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.bezierCurveTo(
        -size*.4,
        -size,
        -size*1.55,
        -size*.75,
        -size*1.25,
        0
    );

    ctx.bezierCurveTo(
        -size*1.1,
        size*.48,
        -.2*size,
        size*.4,
        0,
        0
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.bezierCurveTo(
        size*.4,
        -size,
        size*1.55,
        -size*.75,
        size*1.25,
        0
    );

    ctx.bezierCurveTo(
        size*1.1,
        size*.48,
        .2*size,
        size*.4,
        0,
        0
    );

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        size*.12,
        size*.65,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


function drawButterflies(time){

    const c=center();

    for(const b of butterflies){

        const a=
            b.angle+
            time*b.speed;

        const r=
            b.radius*S();

        const x=
            c.x+
            Math.cos(a)*r;

        const y=
            c.y+
            Math.sin(a*1.37)*r*.72;

        butterfly(
            x,
            y,
            b.size*S(),
            Math.atan2(
                Math.cos(a*1.37),
                -Math.sin(a)
            ),
            time*.012+b.phase
        );
    }

    ctx.globalCompositeOperation=
        "source-over";

    ctx.globalAlpha=1;
}


/* =========================================================
   OPENING
========================================================= */

const start=
    performance.now();


function animate(now){

    const time=
        (now-start)/1000;


    ctx.clearRect(
        0,0,W,H
    );


    background(time);

    dramaticLight(time);


    /*
       opening
    */

    const opening=
        Math.min(
            1,
            Math.max(
                0,
                (time-.1)/5.4
            )
        );

    const eased=
        1-
        Math.pow(
            1-opening,
            3.2
        );


    /*
       stems
    */

    for(const f of flowers){

        const local=
            Math.min(
                1,
                Math.max(
                    0,
                    (time-f.delay)/1.6
                )
            );

        const p=
            1-
            Math.pow(
                1-local,
                3
            );

        stem(
            f,
            p*eased,
            now
        );
    }


    /*
       hanging lavender first
    */

    for(const l of hangingLavender){

        const local=
            Math.min(
                1,
                Math.max(
                    0,
                    (time-l.delay)/1.9
                )
            );

        const p=
            1-
            Math.pow(
                1-local,
                3
            );

        drawHangingLavender(
            l,
            p*eased,
            now
        );
    }


    /*
       small lavender mass
    */

    for(const l of lavender){

        const local=
            Math.min(
                1,
                Math.max(
                    0,
                    (time-l.delay)/1.4
                )
            );

        const p=
            1-
            Math.pow(
                1-local,
                3
            );

        drawLavender(
            l,
            p*eased,
            now
        );
    }


    /*
       random depth sorting
    */

    const sorted=
        [...flowers].sort(
            (a,b)=>
                (a.y+a.depth*100)-
                (b.y+b.depth*100)
        );


    for(const f of sorted){

        const local=
            Math.min(
                1,
                Math.max(
                    0,
                    (time-f.delay)/1.35
                )
            );

        const p=
            1-
            Math.pow(
                1-local,
                4
            );

        drawFlower(
            f,
            p*eased,
            now
        );
    }


    /*
       wrapping stays in front of stems
    */

    wrapping(eased);


    /*
       moving ribbon
    */

    ribbon(
        eased,
        now
    );


    /*
       butterflies
    */

    if(eased>.4){

        drawButterflies(now);
    }


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>
